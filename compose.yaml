services:
  portfolio:
    image: node:22-bookworm-slim
    init: true
    working_dir: /app
    command: sh -c "npm ci && exec npm run dev -- --hostname 0.0.0.0"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - next_cache:/app/.next
    environment:
      NEXT_TELEMETRY_DISABLED: "1"

volumes:
  node_modules:
  next_cache:
